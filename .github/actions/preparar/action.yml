# Etapa 2 del pipeline: entorno reproducible.
# Python fijo + dependencias instaladas SOLO desde el lock con hashes.
name: Preparar entorno
description: Instala Python y las dependencias fijadas de requirements-dev.txt
inputs:
  python-version:
    description: Version de Python
    default: "3.14"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt
    - name: Instalar dependencias fijadas (pip --require-hashes)
      shell: bash
      run: |
        python -m pip install -q --upgrade pip
        python -m pip install -q --require-hashes -r requirements-dev.txt
        python -m pip check
