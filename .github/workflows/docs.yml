# Publica la documentacion (MkDocs) en GitHub Pages cada vez que cambia main.
# main esta protegida: lo que llega aca ya paso el pipeline de CI completo.
name: Documentacion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir sitio
    runs-on: ubuntu-24.04 # fijo: ubuntu-latest cambia de version sin aviso
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar
      - run: python -m mkdocs build --strict --site-dir site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-24.04 # fijo: ubuntu-latest cambia de version sin aviso
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
