[project]
name = "pef-rutas"
version = "2.0.0"
description = "Planificador inteligente de rutas - Programacion Eficiente"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
relative_files = true

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
# E/W: PEP 8 - F: errores - I: orden de imports - N: nombres - D: docstrings
# UP: sintaxis moderna - B: bugs comunes - SIM: simplificaciones
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "SIM"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"bench/*" = ["D103"]

[tool.mypy]
# Politica de tipado (parte 3): todo src/ anotado; cualquier error bloquea el CI.
files = ["src"]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
